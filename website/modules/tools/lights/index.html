<!doctype html>
<html lang="en" class="dark">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
	<link rel="apple-touch-icon" sizes="180x180" href="/assets/img/favicon/apple-touch-icon.png" />
	<link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon/favicon-32x32.png" />
	<link rel="icon" type="image/png" sizes="16x16" href="/assets/img/favicon/favicon-16x16.png" />
	<link rel="manifest" href="/assets/img/favicon/site.webmanifest" />
	<link rel="mask-icon" href="/assets/img/favicon/safari-pinned-tab.svg" color="#c779d0" />
	<link rel="shortcut icon" href="/assets/img/favicon/favicon.ico" />
	<meta name="msapplication-TileColor" content="#05070f" />
	<meta name="msapplication-config" content="/assets/img/favicon/browserconfig.xml" />
	<meta name="theme-color" content="#05070f" />
	<title>Clicker</title>

	<script>
		/* Set the theme before first paint so there is no flash of the wrong one. */
		(() => {
			try {
				const stored = localStorage.getItem('clicker-theme');
				const theme = stored || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
				document.documentElement.classList.toggle('light', theme === 'light');
				document.documentElement.classList.toggle('dark', theme !== 'light');
			} catch { /* defaults to dark */ }
		})();
	</script>

	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link rel="stylesheet"
		href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />
</head>

<body>
	<div class="backdrop" aria-hidden="true">
		<div class="blob blob-1"></div>
		<div class="blob blob-2"></div>
		<div class="blob blob-3"></div>
	</div>
	<div class="grain" aria-hidden="true"></div>

	<div id="root"></div>
	<script type="module" src="/src/main.tsx"></script>
</body>

</html>
